# Cloudflare Pages: sitio estático en public/ + API en functions/ (D1 y R2).
# Este archivo manda sobre los bindings: no se editan desde el dashboard.
# OWNER_EMAIL no va acá (repo público): es un secret → `npx wrangler pages secret put OWNER_EMAIL`.
name = "administrador-proyectos"
pages_build_output_dir = "./public"
compatibility_date = "2025-06-01"

# Producción (rama main)
[vars]
TEAM_DOMAIN = "https://wandering-sunset-7da3.cloudflareaccess.com"   # https://<equipo>.cloudflareaccess.com
POLICY_AUD = "b96a77421c851566541d4c0ad4f6150af0cc1625858b3579d4e5cf2d6ec0f750"    # Application Audience (AUD) Tag de la app de Access
OWNER_ID = "1ce8a7d7-3bd7-4329-b87b-369ded436957"      # id del dueño: prefijo de las rutas de archivos (el uid que tenía en Supabase)

[[d1_databases]]
binding = "DB"
database_name = "administrador-proyectos"
database_id = "c533a341-1cfc-4430-a5e7-42cd80758967"

[[r2_buckets]]
binding = "FILES"
bucket_name = "administrador-proyectos"

# Previews (otras ramas): base y bucket de prueba, para no tocar los datos reales
[env.preview.vars]
TEAM_DOMAIN = "https://wandering-sunset-7da3.cloudflareaccess.com"
POLICY_AUD = "417268e39113091b4a15e2ea0df18a531a62337a1a4940727baebe3e80f7476b"
OWNER_ID = "1ce8a7d7-3bd7-4329-b87b-369ded436957"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "administrador-proyectos-prueba"
database_id = "911f4a87-df00-4798-a1af-3e2314bd69fd"

[[env.preview.r2_buckets]]
binding = "FILES"
bucket_name = "administrador-proyectos-prueba"
